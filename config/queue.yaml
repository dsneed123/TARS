tasks:
- id: tp-01
  title: Add PostgreSQL support and user authentication system
  description: 'Replace SQLite with PostgreSQL using dj-database-url for DATABASE_URL
    env var parsing (keep SQLite fallback for local dev). Add psycopg2-binary to requirements.
    Create a ''accounts'' app with: CustomUser model extending AbstractUser (add fields:
    company_name, plan choices [free, starter, pro, enterprise] default free, created_at).
    Add login, logout, register views with styled pages matching the dark marketing
    theme. Registration form: email, password, company name. Login with email. Add
    password reset flow using Django''s built-in views. After login redirect to /dashboard/.
    Add user menu in nav showing name + logout. Keep landing page and /get-started/
    accessible to anonymous users. Update settings.py with AUTH_USER_MODEL = ''accounts.CustomUser''.
    Add django-allauth or keep it simple with built-in auth. The site domain is usetars.dev.

    '
  project: tars-survey
  priority: 100
  status: pending
- id: tp-02
  title: "Build project management \u2014 users add and manage their repos"
  description: "Create a 'projects' app. Model: Project (owner FK to CustomUser, name,\
    \ github_repo e.g. \"user/repo-name\", description, language choices [python,\
    \ javascript, typescript, go, rust, java, swift, other], default_branch default\
    \ \"main\", is_active default True, created_at). Add views: (1) /dashboard/projects/\
    \ \u2014 list user's projects with status badges. (2) /dashboard/projects/add/\
    \ \u2014 form to add a project (name, GitHub repo URL parsed to owner/repo, description,\
    \ language). Validate the repo exists using GitHub API. (3) /dashboard/projects/<id>/\
    \ \u2014 project detail showing recent tasks, open PRs, settings. (4) /dashboard/projects/<id>/settings/\
    \ \u2014 edit project, toggle active, delete. Add to dashboard nav. All views\
    \ login_required and filtered to current user's projects only.\n"
  project: tars-survey
  priority: 95
  status: pending
- id: tp-03
  title: Build task submission system with file uploads
  description: "Create a 'tasks' app. Models: Task (project FK, created_by FK to user,\
    \ title, description text, status choices [pending, queued, assigned, in_progress,\
    \ reviewing, completed, failed] default pending, priority default 50, worker_id\
    \ nullable, branch_name nullable, pr_url nullable, created_at, started_at nullable,\
    \ completed_at nullable), TaskAttachment (task FK, file FileField upload_to \"\
    attachments/%Y/%m/\", filename, uploaded_at). Views: (1) /dashboard/tasks/new/\
    \ \u2014 form with project dropdown (user's projects only), title, description\
    \ textarea with markdown preview, file upload (multiple files via dropzone or\
    \ simple multi file input \u2014 logos, screenshots, docs). (2) /dashboard/tasks/\
    \ \u2014 list all user's tasks with status badges, filters by project and status,\
    \ sorted by date. (3) /dashboard/tasks/<id>/ \u2014 task detail showing status\
    \ timeline, attachments, PR link when done, worker info. Add drag-drop file upload\
    \ area styled nicely. Configure MEDIA_ROOT and MEDIA_URL in settings. Use S3 in\
    \ production (django-storages) or local filesystem for dev.\n"
  project: tars-survey
  priority: 90
  status: pending
- id: tp-04
  title: Build worker registration and heartbeat system
  description: "Create a 'workers' app. Models: Worker (hostname, ip_address, capacity\
    \ int default 1 meaning max concurrent tasks, current_load int default 0, status\
    \ choices [online, busy, offline, maintenance] default offline, last_heartbeat\
    \ datetime, registered_at, api_key unique for auth, specs text nullable for machine\
    \ info like \"Mac Mini M2 16GB\"). API endpoints: (1) POST /api/workers/register/\
    \ \u2014 worker sends hostname, capacity, specs. Returns api_key. (2) POST /api/workers/heartbeat/\
    \ \u2014 worker sends api_key, current_load, status. Updates last_heartbeat. (3)\
    \ GET /api/workers/next-task/ \u2014 worker polls for next available task. Returns\
    \ highest priority pending task for a project not currently being worked on by\
    \ another worker. Marks task as \"assigned\" and sets worker_id. Uses SELECT FOR\
    \ UPDATE to prevent race conditions. (4) POST /api/workers/task/<id>/update/ \u2014\
    \ worker reports progress (status change, branch name, PR URL, error message).\
    \ Auth all endpoints with X-Worker-Key header. Add admin view at /admin-dashboard/workers/\
    \ showing all workers, their status, load, and last heartbeat. Mark workers offline\
    \ if no heartbeat in 5 minutes.\n"
  project: tars-survey
  priority: 85
  status: pending
- id: tp-05
  title: Build task routing and load balancing
  description: "Add smart task routing to the worker next-task endpoint. When a worker\
    \ requests a task: (1) Find all pending tasks. (2) Score each task by priority\
    \ + how long it's been waiting (age bonus: +1 priority per minute waiting, max\
    \ +50). (3) Check worker capacity \u2014 don't assign if worker at max load. (4)\
    \ Prefer assigning tasks to workers that recently worked on the same project (cache\
    \ warm). (5) Round-robin across workers if equal priority. Add a TaskAssignment\
    \ model (task FK, worker FK, assigned_at, completed_at, result choices [success,\
    \ failed, timeout]) for history. Add a management command \"check_stuck_tasks\"\
    \ that finds tasks assigned > 30 min with no heartbeat update and requeues them.\
    \ Run this via cron or Django-Q. Add load balancing stats to the admin dashboard.\n"
  project: tars-survey
  priority: 80
  status: pending
- id: tp-06
  title: Add git history viewer and rollback functionality
  description: "Add to the project detail page: (1) Git history section showing recent\
    \ commits on the default branch \u2014 fetch via GitHub API (GET /repos/{owner}/{repo}/commits).\
    \ Display commit message, author, date, and SHA. (2) Branch list showing open\
    \ TARS branches. (3) PR list showing open and recently merged PRs from TARS. (4)\
    \ Rollback button on each commit \u2014 creates a new task \"Revert to commit\
    \ {sha}\" that TARS will execute by running git revert. (5) Diff viewer \u2014\
    \ click a commit to see the diff (fetch via GitHub API). Style the git history\
    \ like a timeline. Store GitHub access tokens per user (encrypted) or use the\
    \ project owner's token. For MVP, use the global TARS GitHub token.\n"
  project: tars-survey
  priority: 75
  status: pending
- id: tp-07
  title: Add real-time task status updates with WebSocket
  description: "Add Django Channels with Redis backend for WebSocket support. When\
    \ a worker updates task status via the API, broadcast the update to connected\
    \ clients on that task's detail page and the dashboard task list. Show a live\
    \ status indicator (pulsing dot) on in-progress tasks. Add a simple activity feed\
    \ on the dashboard that updates in real-time as tasks complete. Add channels and\
    \ daphne to requirements.txt. Update Procfile to use daphne instead of gunicorn\
    \ for ASGI support. Configure CHANNEL_LAYERS with Redis. Keep it simple \u2014\
    \ one consumer for task updates, one for the dashboard feed.\n"
  project: tars-survey
  priority: 70
  status: pending
- id: tp-08
  title: Add admin analytics dashboard with engagement tracking
  description: "Create 'analytics' app. Models: PageView (path, user FK nullable,\
    \ ip_address, user_agent, referrer, created_at), Event (name like \"task_submitted\"\
    \ or \"signup_completed\" or \"project_added\", user FK nullable, metadata JSONField,\
    \ created_at). Add middleware logging every page view. Fire events on key actions\
    \ (signup, task submit, project add, task complete). Build admin dashboard at\
    \ /admin-dashboard/ (staff only): (1) KPI cards \u2014 total users, active projects,\
    \ tasks this week, completion rate. (2) Page views chart (CSS bar chart, last\
    \ 30 days). (3) Conversion funnel \u2014 visitors \u2192 signups \u2192 project\
    \ added \u2192 first task. (4) Top pages ranked by views. (5) Worker fleet status\
    \ \u2014 online/offline/busy counts. (6) Recent signups list. Filter by date range.\n"
  project: tars-survey
  priority: 65
  status: pending
- id: tp-09
  title: Add user onboarding flow and getting started guide
  description: "After registration, redirect to /dashboard/onboarding/ with a step-by-step\
    \ setup wizard: Step 1 \u2014 \"Add Your First Project\" (inline project add form).\
    \ Step 2 \u2014 \"Submit Your First Task\" (example tasks like \"Add a favicon\"\
    , \"Fix the README\", \"Add dark mode\"). Step 3 \u2014 \"Watch TARS Work\" (explanation\
    \ of what happens next, link to task detail). Track onboarding progress in a UserProfile\
    \ model (onboarding_completed boolean, onboarding_step int). Show a progress bar.\
    \ Skip button available. After completion, redirect to dashboard with a welcome\
    \ message. Show onboarding checklist on dashboard sidebar until all steps done.\n"
  project: tars-survey
  priority: 60
  status: pending
- id: tp-10
  title: "Add production infrastructure \u2014 Railway, Redis, PostgreSQL, S3"
  description: 'Finalize production setup for usetars.dev on Railway: (1) Update settings
    to read REDIS_URL for channels + caching. (2) Add django-storages with S3 config
    for file uploads (read AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_STORAGE_BUCKET_NAME
    from env). (3) Update Procfile for daphne ASGI. (4) Add railway.toml with build
    command "pip install -r requirements.txt && python manage.py collectstatic --noinput
    && python manage.py migrate --noinput". (5) Add CSRF_TRUSTED_ORIGINS for usetars.dev.
    (6) Set SECURE_SSL_REDIRECT, SESSION_COOKIE_SECURE, CSRF_COOKIE_SECURE for production.
    (7) Add health check at /health/ returning 200. (8) Add comprehensive tests for
    auth, project CRUD, task submission, worker API, and analytics. (9) Update requirements.txt
    with all new deps: psycopg2-binary, dj-database-url, django-storages, boto3, channels,
    daphne, redis.

    '
  project: tars-survey
  priority: 55
  status: pending
