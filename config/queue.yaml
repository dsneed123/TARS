tasks:
- id: tp-01
  title: Add PostgreSQL support and user authentication system
  description: >
    Replace SQLite with PostgreSQL using dj-database-url for DATABASE_URL env var
    parsing (keep SQLite fallback for local dev). Add psycopg2-binary to requirements.
    Create a 'accounts' app with: CustomUser model extending AbstractUser (add fields:
    company_name, plan choices [free, starter, pro, enterprise] default free, created_at).
    Add login, logout, register views with styled pages matching the dark marketing
    theme. Registration form: email, password, company name. Login with email.
    Add password reset flow using Django's built-in views. After login redirect to
    /dashboard/. Add user menu in nav showing name + logout. Keep landing page and
    /get-started/ accessible to anonymous users. Update settings.py with
    AUTH_USER_MODEL = 'accounts.CustomUser'. Add django-allauth or keep it simple
    with built-in auth. The site domain is usetars.dev.
  project: tars-survey
  priority: 100
  status: pending
- id: tp-02
  title: Build project management — users add and manage their repos
  description: >
    Create a 'projects' app. Model: Project (owner FK to CustomUser, name, github_repo
    e.g. "user/repo-name", description, language choices [python, javascript, typescript,
    go, rust, java, swift, other], default_branch default "main", is_active default True,
    created_at). Add views: (1) /dashboard/projects/ — list user's projects with status
    badges. (2) /dashboard/projects/add/ — form to add a project (name, GitHub repo URL
    parsed to owner/repo, description, language). Validate the repo exists using GitHub
    API. (3) /dashboard/projects/<id>/ — project detail showing recent tasks, open PRs,
    settings. (4) /dashboard/projects/<id>/settings/ — edit project, toggle active,
    delete. Add to dashboard nav. All views login_required and filtered to current user's
    projects only.
  project: tars-survey
  priority: 95
  status: pending
- id: tp-03
  title: Build task submission system with file uploads
  description: >
    Create a 'tasks' app. Models: Task (project FK, created_by FK to user, title,
    description text, status choices [pending, queued, assigned, in_progress, reviewing,
    completed, failed] default pending, priority default 50, worker_id nullable,
    branch_name nullable, pr_url nullable, created_at, started_at nullable,
    completed_at nullable), TaskAttachment (task FK, file FileField upload_to
    "attachments/%Y/%m/", filename, uploaded_at). Views: (1) /dashboard/tasks/new/
    — form with project dropdown (user's projects only), title, description textarea
    with markdown preview, file upload (multiple files via dropzone or simple multi
    file input — logos, screenshots, docs). (2) /dashboard/tasks/ — list all user's
    tasks with status badges, filters by project and status, sorted by date.
    (3) /dashboard/tasks/<id>/ — task detail showing status timeline, attachments,
    PR link when done, worker info. Add drag-drop file upload area styled nicely.
    Configure MEDIA_ROOT and MEDIA_URL in settings. Use S3 in production (django-storages)
    or local filesystem for dev.
  project: tars-survey
  priority: 90
  status: pending
- id: tp-04
  title: Build worker registration and heartbeat system
  description: >
    Create a 'workers' app. Models: Worker (hostname, ip_address, capacity int default 1
    meaning max concurrent tasks, current_load int default 0, status choices [online,
    busy, offline, maintenance] default offline, last_heartbeat datetime, registered_at,
    api_key unique for auth, specs text nullable for machine info like "Mac Mini M2 16GB").
    API endpoints: (1) POST /api/workers/register/ — worker sends hostname, capacity,
    specs. Returns api_key. (2) POST /api/workers/heartbeat/ — worker sends api_key,
    current_load, status. Updates last_heartbeat. (3) GET /api/workers/next-task/ —
    worker polls for next available task. Returns highest priority pending task for a
    project not currently being worked on by another worker. Marks task as "assigned"
    and sets worker_id. Uses SELECT FOR UPDATE to prevent race conditions.
    (4) POST /api/workers/task/<id>/update/ — worker reports progress (status change,
    branch name, PR URL, error message). Auth all endpoints with X-Worker-Key header.
    Add admin view at /admin-dashboard/workers/ showing all workers, their status,
    load, and last heartbeat. Mark workers offline if no heartbeat in 5 minutes.
  project: tars-survey
  priority: 85
  status: pending
- id: tp-05
  title: Build task routing and load balancing
  description: >
    Add smart task routing to the worker next-task endpoint. When a worker requests
    a task: (1) Find all pending tasks. (2) Score each task by priority + how long
    it's been waiting (age bonus: +1 priority per minute waiting, max +50). (3) Check
    worker capacity — don't assign if worker at max load. (4) Prefer assigning tasks
    to workers that recently worked on the same project (cache warm). (5) Round-robin
    across workers if equal priority. Add a TaskAssignment model (task FK, worker FK,
    assigned_at, completed_at, result choices [success, failed, timeout]) for history.
    Add a management command "check_stuck_tasks" that finds tasks assigned > 30 min
    with no heartbeat update and requeues them. Run this via cron or Django-Q.
    Add load balancing stats to the admin dashboard.
  project: tars-survey
  priority: 80
  status: pending
- id: tp-06
  title: Add git history viewer and rollback functionality
  description: >
    Add to the project detail page: (1) Git history section showing recent commits
    on the default branch — fetch via GitHub API (GET /repos/{owner}/{repo}/commits).
    Display commit message, author, date, and SHA. (2) Branch list showing open
    TARS branches. (3) PR list showing open and recently merged PRs from TARS.
    (4) Rollback button on each commit — creates a new task "Revert to commit {sha}"
    that TARS will execute by running git revert. (5) Diff viewer — click a commit
    to see the diff (fetch via GitHub API). Style the git history like a timeline.
    Store GitHub access tokens per user (encrypted) or use the project owner's
    token. For MVP, use the global TARS GitHub token.
  project: tars-survey
  priority: 75
  status: pending
- id: tp-07
  title: Add real-time task status updates with WebSocket
  description: >
    Add Django Channels with Redis backend for WebSocket support. When a worker
    updates task status via the API, broadcast the update to connected clients
    on that task's detail page and the dashboard task list. Show a live status
    indicator (pulsing dot) on in-progress tasks. Add a simple activity feed
    on the dashboard that updates in real-time as tasks complete. Add channels
    and daphne to requirements.txt. Update Procfile to use daphne instead of
    gunicorn for ASGI support. Configure CHANNEL_LAYERS with Redis. Keep it
    simple — one consumer for task updates, one for the dashboard feed.
  project: tars-survey
  priority: 70
  status: pending
- id: tp-08
  title: Add admin analytics dashboard with engagement tracking
  description: >
    Create 'analytics' app. Models: PageView (path, user FK nullable, ip_address,
    user_agent, referrer, created_at), Event (name like "task_submitted" or
    "signup_completed" or "project_added", user FK nullable, metadata JSONField,
    created_at). Add middleware logging every page view. Fire events on key actions
    (signup, task submit, project add, task complete). Build admin dashboard at
    /admin-dashboard/ (staff only): (1) KPI cards — total users, active projects,
    tasks this week, completion rate. (2) Page views chart (CSS bar chart, last 30
    days). (3) Conversion funnel — visitors → signups → project added → first task.
    (4) Top pages ranked by views. (5) Worker fleet status — online/offline/busy
    counts. (6) Recent signups list. Filter by date range.
  project: tars-survey
  priority: 65
  status: pending
- id: tp-09
  title: Add user onboarding flow and getting started guide
  description: >
    After registration, redirect to /dashboard/onboarding/ with a step-by-step
    setup wizard: Step 1 — "Add Your First Project" (inline project add form).
    Step 2 — "Submit Your First Task" (example tasks like "Add a favicon",
    "Fix the README", "Add dark mode"). Step 3 — "Watch TARS Work" (explanation
    of what happens next, link to task detail). Track onboarding progress in a
    UserProfile model (onboarding_completed boolean, onboarding_step int).
    Show a progress bar. Skip button available. After completion, redirect to
    dashboard with a welcome message. Show onboarding checklist on dashboard
    sidebar until all steps done.
  project: tars-survey
  priority: 60
  status: pending
- id: tp-10
  title: Add production infrastructure — Railway, Redis, PostgreSQL, S3
  description: >
    Finalize production setup for usetars.dev on Railway: (1) Update settings
    to read REDIS_URL for channels + caching. (2) Add django-storages with S3
    config for file uploads (read AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
    AWS_STORAGE_BUCKET_NAME from env). (3) Update Procfile for daphne ASGI.
    (4) Add railway.toml with build command "pip install -r requirements.txt &&
    python manage.py collectstatic --noinput && python manage.py migrate --noinput".
    (5) Add CSRF_TRUSTED_ORIGINS for usetars.dev. (6) Set SECURE_SSL_REDIRECT,
    SESSION_COOKIE_SECURE, CSRF_COOKIE_SECURE for production. (7) Add health
    check at /health/ returning 200. (8) Add comprehensive tests for auth,
    project CRUD, task submission, worker API, and analytics. (9) Update
    requirements.txt with all new deps: psycopg2-binary, dj-database-url,
    django-storages, boto3, channels, daphne, redis.
  project: tars-survey
  priority: 55
  status: pending
- id: tp-11
  title: Polish landing page — premium design, animations, and branding
  description: >
    Overhaul the landing page at usetars.dev to look world-class. (1) Add smooth
    scroll-triggered fade-in animations on sections using CSS @keyframes and
    IntersectionObserver (no heavy JS libraries). (2) Add a gradient animated hero
    background — dark navy to deep purple gradient with subtle particle/grid animation
    using pure CSS. (3) Add a floating nav that becomes solid on scroll. (4) Add
    smooth anchor scrolling between sections. (5) Make the metrics counter animate
    counting up when scrolled into view. (6) Add subtle hover effects on all cards —
    lift shadow, slight scale. (7) Add a "Trusted by developers at" logo bar (use
    placeholder company silhouettes for now). (8) Improve typography — use Inter or
    Space Grotesk from Google Fonts. (9) Add proper spacing, consistent padding,
    visual hierarchy. (10) Ensure everything is pixel-perfect responsive — test at
    mobile 375px, tablet 768px, desktop 1200px+. The site should feel like Linear,
    Vercel, or Stripe level quality.
  project: tars-survey
  priority: 50
  status: pending
- id: tp-12
  title: Perfect the inquiry form UX and add smart validation
  description: >
    Redesign the /get-started/ inquiry form to feel premium: (1) Multi-step form
    with progress indicator — Step 1: Company info (name, email, size), Step 2:
    Project details (description, language, repo URL optional), Step 3: Budget
    and timeline. (2) Real-time inline validation with friendly error messages
    (not red boxes — subtle orange text below fields). (3) Auto-save form progress
    to localStorage so users don't lose data if they navigate away. (4) Add a
    floating sidebar showing "What happens next?" with timeline: "We review your
    project (24h) → Custom proposal → TARS starts building". (5) Success page
    with confetti animation (CSS only) and clear next steps. (6) Add Google
    reCAPTCHA v3 (invisible) to prevent spam — read RECAPTCHA_SITE_KEY and
    RECAPTCHA_SECRET_KEY from env vars. (7) Mobile-first responsive layout.
  project: tars-survey
  priority: 48
  status: pending
- id: tp-13
  title: Build polished member dashboard with activity feed
  description: >
    Make the /dashboard/ feel like a real SaaS product: (1) Left sidebar nav with
    icons — Dashboard, Projects, Tasks, Settings. Collapsible on mobile into a
    hamburger menu. (2) Dashboard home shows: welcome message with user's name,
    quick stats cards (active projects, tasks this month, completed tasks, success
    rate) with subtle animations. (3) Activity feed with real-time updates — show
    task status changes, PR merges, new commits with timestamps and colored status
    dots. (4) "New Task" floating action button that opens a clean modal form.
    (5) Project cards showing health status — green dot for active, yellow for
    issues, red for failed tasks. (6) Empty states with illustrations and CTAs
    when user has no projects/tasks yet ("Add your first project to get started").
    (7) Dark theme matching the marketing site. (8) Breadcrumb navigation.
    (9) Toast notifications for success/error actions using CSS transitions.
  project: tars-survey
  priority: 46
  status: pending
- id: tp-14
  title: Add billing page with Stripe integration setup
  description: >
    Create a /dashboard/billing/ page showing: (1) Current plan card (Free, Starter
    $49/mo, Pro $149/mo, Enterprise custom). (2) Feature comparison table — Free:
    1 project, 10 tasks/mo. Starter: 5 projects, 50 tasks/mo, priority queue.
    Pro: unlimited projects, unlimited tasks, dedicated worker, Slack integration.
    Enterprise: custom everything. (3) "Upgrade" buttons linking to Stripe Checkout
    (use stripe.checkout.Session.create). Read STRIPE_SECRET_KEY and
    STRIPE_PUBLISHABLE_KEY and STRIPE_WEBHOOK_SECRET from env. (4) Add Stripe
    webhook endpoint at /webhooks/stripe/ to handle checkout.session.completed
    and update user's plan. (5) Add Plan model (name, stripe_price_id,
    max_projects, max_tasks_per_month, price_cents). (6) Add Subscription model
    (user FK, plan FK, stripe_subscription_id, status, current_period_end).
    (7) Usage meter on billing page showing tasks used this month vs limit.
    Add stripe to requirements.txt.
  project: tars-survey
  priority: 44
  status: pending
- id: tp-15
  title: Add email sequences and notification system
  description: >
    Build a proper notification system: (1) Welcome email sequence — on signup send
    welcome email immediately, then "Getting started with TARS" email 24h later
    (use a management command + cron for delayed sends). (2) Task notifications —
    email user when task starts, when PR is ready for review, when task fails.
    (3) Weekly digest email — summary of tasks completed, PRs merged, projects
    status. (4) In-app notification bell in the nav bar with a dropdown showing
    recent notifications (Notification model: user FK, title, message, link,
    is_read, created_at). (5) Notification preferences page at
    /dashboard/settings/notifications/ — toggle email notifications per type.
    (6) All emails use a beautiful HTML template with the TARS branding, dark
    header, clean layout. Create base_email.html template.
  project: tars-survey
  priority: 42
  status: pending
- id: tp-16
  title: Add comprehensive error pages and loading states
  description: >
    (1) Custom 404 page — dark themed, witty message like "This page got lost in
    the codebase", link back to home and dashboard. (2) Custom 500 page — "TARS
    hit a bug. We're on it." with support email link. (3) Custom 403 page.
    (4) Add loading skeletons on all dashboard pages — gray pulsing placeholder
    blocks that show while content loads (CSS animation, no JS). (5) Add empty
    state illustrations for: no projects, no tasks, no notifications — each with
    helpful CTA. (6) Add form submission loading states — button shows spinner
    and disables on click. (7) Add toast notification system — success (green),
    error (red), info (blue) toasts that slide in from top-right and auto-dismiss
    after 5 seconds. Pure CSS + minimal JS. (8) Configure Django handler404 and
    handler500 in urls.py.
  project: tars-survey
  priority: 40
  status: pending
- id: tp-17
  title: Add comprehensive test suite and CI pipeline
  description: >
    Write thorough tests and set up CI: (1) Model tests — all models, field
    validation, relationships, default values. (2) View tests — every page returns
    correct status code, login required views redirect, forms validate correctly.
    (3) API tests — all endpoints, auth, error responses, edge cases. (4) Form
    tests — valid and invalid submissions, file uploads. (5) Integration tests —
    full user flow: register → add project → submit task → check status.
    (6) Create .github/workflows/ci.yml: run on push/PR to main, setup Python,
    install deps, run migrations, run tests with coverage, fail if coverage below
    80%. (7) Add pytest + pytest-django + pytest-cov to requirements. (8) Add
    coverage config in pyproject.toml. Target 85%+ coverage.
  project: tars-survey
  priority: 38
  status: pending
- id: tp-18
  title: Add documentation site and API docs
  description: >
    Create /docs/ section of the site (public, no login): (1) Getting Started
    guide — signup, add first project, submit first task. (2) Worker Setup guide —
    how to set up a TARS worker on a new machine (for self-hosted users later).
    (3) API Reference — document all API endpoints with request/response examples,
    auth headers, error codes. Use clean formatted HTML, not a separate docs tool.
    (4) FAQ section (move from /faq/ or link to it). (5) Changelog page showing
    recent updates to the platform. (6) Status page at /status/ showing if the
    platform is operational (simple green/red indicator checking DB and worker
    heartbeats). (7) Add a "Docs" link in the marketing nav and dashboard sidebar.
  project: tars-survey
  priority: 36
  status: pending
- id: tp-19
  title: Performance optimization and security hardening
  description: >
    (1) Add Django caching — cache landing page for 5 min, cache dashboard stats
    for 1 min, use Redis cache backend if REDIS_URL set, else LocMemCache.
    (2) Add database indexes on frequently queried fields — Task.status,
    Task.project, Task.created_at, PageView.created_at, Inquiry.status.
    (3) Add rate limiting on API endpoints and login — use django-ratelimit,
    5 attempts per minute on login, 30 requests per minute on API. (4) Add
    Content-Security-Policy header. (5) Add HSTS header. (6) Sanitize all
    user inputs — bleach any HTML in text fields. (7) Add request logging
    middleware that logs slow requests (>500ms). (8) Optimize database queries —
    add select_related and prefetch_related where needed, check for N+1 queries.
    (9) Add django-debug-toolbar for dev mode. (10) Compress static assets
    with whitenoise brotli.
  project: tars-survey
  priority: 34
  status: pending
- id: tp-20
  title: Final polish — favicon, OG images, meta, and launch checklist
  description: >
    Final launch prep for usetars.dev: (1) Create a proper favicon — dark
    background with "T" letter mark in accent color. Generate all sizes
    (16x16, 32x32, 180x180 apple-touch, android-chrome 192 and 512). Use
    SVG favicon for modern browsers. (2) Create Open Graph image (1200x630)
    for social sharing — dark background with TARS logo, tagline "Ship Code
    While You Sleep", and usetars.dev URL. (3) Add Twitter card meta tags
    (large image summary). (4) Verify all page titles follow pattern "Page
    Name | TARS — Autonomous Coding". (5) Add canonical URLs to all pages.
    (6) Test every page on Google Lighthouse — target 90+ on Performance,
    Accessibility, Best Practices, SEO. Fix any issues. (7) Add sitemap.xml
    with all public pages. (8) Verify robots.txt allows crawling. (9) Add
    structured data JSON-LD for Organization and WebApplication schemas.
    (10) Test on Chrome, Safari, Firefox, and mobile Safari/Chrome.
  project: tars-survey
  priority: 32
  status: pending
