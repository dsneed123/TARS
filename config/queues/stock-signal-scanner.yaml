- id: web-9388adc5
  title: Browser-based continuous research worker (Playwright)
  description: "Add a browser-based continuous research worker to the ingestion layer.\
    \ Use Playwright with headless Chromium to fetch and render JS-heavy news pages\
    \ that plain HTTP fetchers cannot read, extracting clean article text (title,\
    \ body, published date, outlet) from the rendered DOM. Add a 'scanner research'\
    \ CLI mode that runs a continuous loop: cycle through a configurable list of watch\
    \ URLs and site sections (config.yaml: research.sites, research.cycle_seconds,\
    \ research.max_pages_per_cycle), fetch anything new, dedupe against already-stored\
    \ sources, and persist to the sources table so the analysis engine picks them\
    \ up on the next batch. Respect robots.txt, apply per-domain rate limits and a\
    \ polite user-agent, and back off on repeated failures. Wire this mode into the\
    \ scheduler and docker-compose (install Playwright browsers in the Dockerfile),\
    \ add unit tests for the DOM text extraction with saved HTML fixtures, and update\
    \ the README to document the continuous browser research mode. The analysis LLM\
    \ itself must never browse \u2014 it only ever sees the source documents this\
    \ worker stores."
  project: stock-signal-scanner
  task_type: tars-code
  priority: 60
  status: cancelled
  user_id: null
  survey_task_id: null
  source: website
  created_at: '2026-07-10T03:21:59.933818+00:00'
  cancelled_at: '2026-07-10T03:23:32.440880+00:00'
- id: web-03c566ef
  title: 'CORE: purely browser-based continuous research engine'
  description: "Build the CORE component of this app: a purely browser-based continuous\
    \ research engine. This is the ONLY ingestion path \u2014 do not add RSS, API,\
    \ or plain-HTTP fetchers. Use Playwright with headless Chromium to visit, render,\
    \ and read real web pages, including JS-heavy sites. Implement a continuous research\
    \ loop (CLI: 'scanner research') that endlessly cycles a configurable watch-list\
    \ defined in config.yaml under research.sites. Each watch-list entry has: url,\
    \ outlet name, and a source_type category \u2014 one of 'deals' (business-deal\
    \ and M&A news sections, press-release pages), 'chatter' (forums and social discussion\
    \ pages \u2014 what people are saying about tickers), or 'news' (general market\
    \ and company news pages). For each cycle: render the page, discover new article/thread\
    \ links, open each new one, extract clean text from the rendered DOM (title, body,\
    \ published date, outlet), skip anything already stored (dedupe by URL hash and\
    \ near-duplicate title), and persist to the sources table with its source_type\
    \ tag and fetched-at timestamp. Politeness is mandatory: respect robots.txt, per-domain\
    \ rate limits with jitter, a descriptive user-agent, exponential backoff per failing\
    \ domain, and config caps research.cycle_seconds and research.max_pages_per_cycle.\
    \ Ship a default watch-list in config.yaml covering all three categories with\
    \ real example sites. Add unit tests for link discovery and DOM text extraction\
    \ using saved HTML fixtures (no network in tests). Install Playwright browsers\
    \ in the Dockerfile. The analysis LLM itself must NEVER browse \u2014 it only\
    \ sees the documents this engine stores."
  project: stock-signal-scanner
  task_type: tars-code
  priority: 97
  status: completed
  user_id: null
  survey_task_id: null
  source: website
  created_at: '2026-07-10T03:23:51.697818+00:00'
  completed_at: '2026-07-10T06:20:44Z'
- id: web-2138769c
  title: Batcher with balanced source mix (anti-hype)
  description: "Implement the batcher that feeds the analysis engine, with a balanced\
    \ source mix so the model is informed by public chatter without being unduly influenced\
    \ by it. Select recent un-analyzed documents from the sources table (configurable\
    \ window, default 24h) and format each batch EXACTLY as the analysis system prompt\
    \ expects: <source url=\"...\" published=\"...\" outlet=\"...\">clean text</source>,\
    \ chunked to a configurable token budget. Balance rules: cap 'chatter'-type documents\
    \ at a configurable maximum share of each batch (default 40 percent), always include\
    \ available 'deals' and 'news' documents first, and never emit a batch that is\
    \ chatter-only unless nothing else exists \u2014 in that case tag the batch social_only=true\
    \ so downstream guardrails cap confidence at 35 per the rubric. Include each document's\
    \ outlet and published date accurately in the source tag \u2014 never fabricate\
    \ metadata. Record which documents went into which batch (batches table) so cards\
    \ can resolve citations back to stored sources. Unit-test the balancing logic,\
    \ chunking, and exact tag formatting."
  project: stock-signal-scanner
  task_type: tars-code
  priority: 96
  status: completed
  user_id: null
  survey_task_id: null
  source: website
  created_at: '2026-07-10T03:23:51.974431+00:00'
