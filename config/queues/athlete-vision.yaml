tasks:
- id: av-01
  title: Scaffold project structure with CLI entry point and MediaPipe pose estimation
  description: >
    Create the full project scaffold:
    1. requirements.txt with mediapipe, opencv-python, numpy, pandas, click
    2. src/athlete_vision/__init__.py
    3. src/athlete_vision/cli.py — Click CLI that takes --video-dir and --output paths,
       loops through all .mp4/.mov/.avi files in the folder, processes each
    4. src/athlete_vision/pose_estimator.py — MediaPipe Pose wrapper that:
       - Opens a video with OpenCV
       - Runs MediaPipe Pose on every frame
       - Tracks keypoints: ankles, knees, hips, shoulders, elbows, wrists
       - Returns a DataFrame of keypoint coordinates (x, y, z, visibility) per frame with timestamps
       - Calculates average tracking confidence per joint
    5. README.md with usage instructions
    6. tests/ directory with test_pose_estimator.py
    7. setup.py or pyproject.toml for package install
    This is the foundation everything else builds on.
  project: athlete-vision
  priority: 200
  status: pending
  source: manual

- id: av-02
  title: Implement stride analysis — length, frequency, and ground contact time
  description: >
    Create src/athlete_vision/stride_analyzer.py:
    1. Detect individual strides from ankle keypoint trajectories — a stride is one full
       cycle of a foot (ground contact to next ground contact of same foot)
    2. Calculate stride length in pixels, then convert to meters using a calibration factor
       (default: user provides known distance like the 40-yard line markings)
    3. Calculate stride frequency (strides per second) from stride timestamps
    4. Calculate ground contact time per stride — the duration (ms) the foot is on/near
       the ground (ankle y-coordinate below threshold)
    5. Return per-stride data and averages
    Input: keypoint DataFrame from pose_estimator. Output: dict with stride_length,
    stride_frequency, ground_contact_ms (all averaged).
  project: athlete-vision
  priority: 190
  status: pending
  source: manual

- id: av-03
  title: Implement body angle calculations — drive phase, hip extension, forward lean
  description: >
    Create src/athlete_vision/angle_analyzer.py:
    1. Drive phase angle — calculate torso angle from horizontal (using hip-shoulder vector)
       during the first 10 yards (first ~25% of frames). Average across that window.
    2. Hip extension at push-off — angle between thigh (hip-knee) and torso (hip-shoulder)
       at the moment of push-off (when trailing foot leaves ground). Use max extension
       angle from each stride.
    3. Forward lean angle — torso angle from vertical during acceleration phase
       (first 15 yards / ~35% of frames)
    4. Transition point — detect the frame where the athlete transitions from
       acceleration (forward lean >20 degrees) to upright running (<15 degrees).
       Convert frame number to approximate yard marker using total distance / total frames.
    All angles calculated from keypoint vectors using atan2. Return dict with
    drive_phase_angle, hip_extension, forward_lean_angle, transition_point_yards.
  project: athlete-vision
  priority: 180
  status: pending
  source: manual

- id: av-04
  title: Implement arm swing symmetry and velocity calculations
  description: >
    Add to src/athlete_vision/:
    1. arm_analyzer.py — Arm swing symmetry score (0-100):
       - Track wrist trajectory arcs for left and right arms
       - Measure swing amplitude (max forward - max backward position) for each arm
       - Symmetry = 100 - abs(left_amplitude - right_amplitude) / max(left, right) * 100
       - Also detect cross-body arm swing (bad form) vs straight-back (good form)
    2. velocity_analyzer.py — Peak velocity calculation:
       - Track hip midpoint displacement between frames
       - Convert pixel displacement to meters using calibration
       - Calculate instantaneous velocity at each frame
       - Smooth with rolling window (5 frames)
       - Find peak velocity, convert m/s to mph
       - Also calculate 40-yard dash time from first movement frame to finish frame
    Return: arm_swing_symmetry (0-100), peak_velocity_mph, forty_time (seconds)
  project: athlete-vision
  priority: 170
  status: pending
  source: manual

- id: av-05
  title: Build the full pipeline — folder processing, CSV output, quality flagging, summary
  description: >
    Create src/athlete_vision/pipeline.py that ties everything together:
    1. Takes a video directory path
    2. Loops through all video files (.mp4, .mov, .avi, .mkv)
    3. For each video: run pose estimation → stride analysis → angle analysis →
       arm analysis → velocity analysis
    4. Collect all metrics into one row per video
    5. Data quality flagging — set data_quality column to REVIEW if:
       - Average keypoint confidence < 85% on critical joints (hips, knees, ankles)
       - Video has <100 frames (too short)
       - Tracking lost for >10% of frames
       - Non-standard aspect ratio suggesting bad camera angle
    6. Output complete CSV with columns: athlete_id, video_filename, forty_time,
       stride_length, stride_frequency, ground_contact_ms, drive_phase_angle,
       hip_extension, arm_swing_symmetry, forward_lean_angle, transition_point_yards,
       peak_velocity_mph, data_quality
    7. Print summary: files processed, flagged, failed, distribution of 40 times and velocities
    8. Handle errors per-video gracefully (log and continue to next)
    Update cli.py to call this pipeline.
  project: athlete-vision
  priority: 160
  status: pending
  source: manual

- id: av-06
  title: Add camera calibration, distance estimation, and unit tests
  description: >
    1. src/athlete_vision/calibration.py — Camera calibration support:
       - Auto-detect yard line markings in the video using line detection
       - Or accept user-provided reference distance (e.g., "40 yards between these two points")
       - Calculate pixels-per-meter conversion factor
       - Apply to all distance-based calculations (stride length, velocity)
    2. Add comprehensive unit tests:
       - test_stride_analyzer.py — test with synthetic keypoint data
       - test_angle_analyzer.py — test angle calculations with known vectors
       - test_arm_analyzer.py — test symmetry scoring
       - test_velocity_analyzer.py — test displacement and velocity math
       - test_pipeline.py — integration test with a short synthetic video
    3. Add --calibration-distance and --calibration-unit CLI flags
  project: athlete-vision
  priority: 150
  status: pending
  source: manual

- id: av-07
  title: Build YouTube 40-yard dash video downloader and auto-processor
  description: >
    Create src/athlete_vision/video_downloader.py using yt-dlp to download real
    40-yard dash videos from YouTube:
    1. Search YouTube for "40 yard dash" "40 yard dash combine" "NFL combine 40"
       "high school 40 yard dash" "college 40 yard dash" using yt-dlp search
    2. Download up to 40 videos, 720p or 1080p, side-angle preferred
    3. Filter out compilations (>2 min long), keep individual run clips
    4. Save to videos/ directory with descriptive filenames
    5. For each downloaded video, try to extract the athlete name and known 40 time
       from the video title/description (e.g. "John Ross 4.22 40 yard dash")
       Store this as metadata in videos/metadata.json
    6. CLI command: athlete-vision download --count 40 --output-dir ./videos/
    7. Add yt-dlp to requirements.txt
    Then automatically run the full extraction pipeline on all downloaded videos
    and output the CSV dataset. Compare extracted times against known times from
    video titles where available.
  project: athlete-vision
  priority: 195
  status: pending
  source: manual

- id: av-08
  title: Batch process real videos and validate extracted 40 times
  description: >
    Create src/athlete_vision/batch_processor.py:
    1. Point at the videos/ directory of downloaded real 40-yard dash footage
    2. Run the full pipeline on every video — pose estimation, stride analysis,
       angle calculations, velocity, arm swing
    3. Output the complete CSV dataset
    4. Where metadata.json has a known 40 time (from video title), compare
       extracted time vs known time and report accuracy
    5. Print a full summary:
       - Total videos processed vs failed vs flagged for review
       - Distribution of extracted 40 times (histogram buckets)
       - Distribution of peak velocities
       - Average stride length, frequency across all athletes
       - Accuracy report: mean error on 40 times where ground truth is known
    6. CLI command: athlete-vision batch --video-dir ./videos/ --output dataset.csv
    7. Also add: athlete-vision report --csv dataset.csv
       That generates a visual HTML report with charts of the dataset distribution
  project: athlete-vision
  priority: 185
  status: pending
  source: manual

- id: av-09
  title: Build web GUI for uploading and analyzing 40-yard dash videos
  description: >
    Create a web-based GUI so users can drag-and-drop or upload a video and see
    results visually. Use Flask or Streamlit (Streamlit preferred for speed).
    Create src/athlete_vision/web_app.py:
    1. Upload page — drag-and-drop or file picker for .mp4/.mov/.avi videos
    2. Processing page — show progress bar while running pose estimation + analysis
    3. Results page with:
       - Video playback with skeleton overlay (draw keypoints on each frame)
       - 40-yard dash time displayed prominently
       - All metrics in a clean dashboard layout:
         Stride length, stride frequency, ground contact time,
         drive phase angle, hip extension, arm swing symmetry,
         forward lean angle, transition point, peak velocity
       - Charts: velocity over time, stride length over time, body angle over time
       - Color-coded grades (green/yellow/red) for each metric vs elite benchmarks
       - Download CSV button for the single video's data
    4. Batch upload page — upload multiple videos, process all, download full CSV
    5. Data quality indicator — show tracking confidence, flag issues
    6. Elite comparison — show how the athlete's metrics compare to NFL combine averages:
       - Elite 40 time: 4.3-4.5s
       - Good stride length: 2.2-2.5m
       - Elite peak velocity: 21-23 mph
    7. CLI: athlete-vision web --port 8200
    8. Add streamlit to requirements.txt
    Make it clean, professional, and easy to use. This is the main user-facing product.
  project: athlete-vision
  priority: 175
  status: pending
  source: manual
