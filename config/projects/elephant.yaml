repo: dsneed123/elephant
description: >-
  Elephant — Kalshi prediction market copy-trading platform. Tracks the top 0.01% of Kalshi
  bettors who almost never lose, analyzes their performance, and copies their trades with
  intelligent money management.

  ARCHITECTURE: Python FastAPI backend + React/TypeScript frontend. SQLite for dev, PostgreSQL
  for prod. Kalshi API integration via kalshi_python_sync SDK + raw REST/WebSocket.

  HOW COPY-TRADING WORKS ON KALSHI: Individual user trades are PRIVATE (unlike Polymarket's
  public blockchain). Our approach:
  (1) Scrape Kalshi leaderboard (kalshi.com/social/leaderboard) for top performers — get
      usernames, profit, win rate, volume, consistency metrics
  (2) Monitor order book changes in real-time via WebSocket — detect whale-sized orders
      (large volume shifts, significant price movements) that correlate with top trader activity
  (3) Score each tracked trader with an "Elephant Score" combining win rate, consistency,
      ROI, market diversity, and recency
  (4) When a high-confidence signal fires (top trader likely entering a position), auto-copy
      the trade with configurable position sizing (Kelly criterion or fixed %)
  (5) Dashboard shows tracked traders, signals, copied trades, portfolio P&L

  KALSHI API: Base URL https://api.kalshi.com/trade-api/v2. Auth via RSA-PSS signatures
  (KALSHI-ACCESS-KEY + KALSHI-ACCESS-TIMESTAMP + KALSHI-ACCESS-SIGNATURE headers).
  Public endpoints (no auth): /markets, /events, order books, trade history.
  Authenticated endpoints: /portfolio/orders (create/cancel), /portfolio/positions.
  Rate limits: Basic tier 20 reads/sec, 10 writes/sec.
  SDK: pip install kalshi_python_sync (official, sync) or kalshi_python_async (async).

  IMPORTANT CONSTRAINTS: Do NOT create .github/workflows files. Do NOT hardcode API keys
  (use .env + pydantic-settings). All Kalshi API calls must handle rate limits gracefully.
  The leaderboard scraping must be respectful (cache results, don't hammer the page).
type: python
enabled: false
git:
  strategy: auto-merge
  base_branch: main
  pr_labels: []
build:
  type: generic
  command: cd backend && rm -rf .venv && python3 -m venv --without-pip .venv && .venv/bin/python3 -m ensurepip --upgrade && .venv/bin/python3 -m pip install -r requirements.txt --quiet
test:
  command: cd backend && .venv/bin/python -m pytest -q; rc=$?; [ $rc -eq 0 ] || [ $rc -eq 5 ]
issues:
  enabled: false
  labels:
  - bug
  - enhancement
auto_discover:
  enabled: false
  interval: 120
  focus_areas:
  - leaderboard scraper — build robust scraper for kalshi.com/social/leaderboard, parse trader profiles, extract profit/win rate/volume/consistency, store in TrackedTrader table, run on schedule
  - elephant scoring algorithm — composite score (0-100) weighting win rate (30%), consistency (25%), ROI (20%), market diversity (15%), recency (10%), identify top 0.01% traders
  - order book whale detection — WebSocket connection to Kalshi, monitor real-time order book changes, detect large orders (>$1000), correlate timing with known top trader activity
  - trade signal generation — when whale activity detected in a market where top traders are likely active, create TradeSignal with confidence score
  - copy-trade execution engine — when high-confidence signal fires, calculate position size (Kelly criterion or max 5% of portfolio), place order via Kalshi API, track in CopiedTrade table
  - money management — position sizing, max exposure limits, stop-loss logic, portfolio rebalancing, risk-adjusted returns
  - React dashboard frontend — real-time UI showing tracked traders, active signals, copied trades, portfolio P&L chart, settings
  - backtesting engine — historical analysis of tracked traders' performance, simulate copy-trading results
  - API error handling and resilience — retry logic, rate limit handling, circuit breakers, graceful degradation
  - testing and reliability
claude:
  model: sonnet
  max_turns: 25
