repo: dsneed123/crypto-trading-bot
description: Autonomous cryptocurrency trading bot with GUI dashboard, no external
  API keys required
type: generic
enabled: true
git:
  strategy: direct-main
  base_branch: main
  pr_labels:
  - tars-auto
  auto_merge: false
  author_name: dsneed123
  author_email: 101902819+dsneed123@users.noreply.github.com
build:
  type: generic
  command: '[ -d venv ] || python3 -m venv venv; venv/bin/pip install -q ccxt && venv/bin/python
    -c ''import sys; sys.path.insert(0,"src"); import backend, trading_engine, strategy,
    risk_management'' && venv/bin/python -c ''import main'''
test:
  command: null
issues:
  enabled: false
  labels:
  - tars
auto_discover:
  enabled: false
  interval: 86400
  focus_areas: []
claude:
  model: sonnet
  max_turns: 20
self_improve:
  enabled: true
  max_queued: 3
  goal: 'continuously find and implement improvements and efficiencies: faster and
    cleaner code paths, better algorithms, smarter resource use, and small features
    that make the bot measurably better'
