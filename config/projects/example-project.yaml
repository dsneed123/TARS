# Example TARS project configuration
# Copy this file and customize for your project

repo: "username/my-project"
enabled: false                   # Set to true to activate

git:
  strategy: "branch-pr"         # branch-pr | auto-merge | direct-main
  base_branch: "main"
  pr_labels: ["tars-auto"]
  auto_merge: false             # true = merge straight to base_branch, no PR
                                # (overrides strategy -> direct-main)
  # Commit identity for autonomous commits. Default (unset) = "TARS Bot"
  # <tars@usetars.dev>, so TARS-authored work stays visibly separate from
  # human commits. Set both to attribute commits to a real GitHub account
  # instead — the email must be verified on that account for GitHub to link
  # the avatar/profile to the commit.
  author_name: null             # e.g. "Jane Doe"
  author_email: null            # e.g. "jane@example.com"

build:
  type: "generic"               # generic | xcode
  command: null                  # e.g. "npm run build", "cargo build"

test:
  command: null                  # e.g. "npm test", "pytest"

issues:
  enabled: false
  labels: ["tars", "auto-fix"]

auto_discover:
  enabled: false
  interval: 86400               # seconds between discovery runs
  focus_areas:
    - "test coverage"
    - "error handling"
    - "code cleanup"

claude:
  # Under TARS_LLM_PROVIDER=ollama (default), model routing is role-based
  # (see tars.conf OLLAMA_*_MODEL) and this field is ignored unless you set a
  # real Ollama tag here (e.g. "qwen2.5-coder:32b") to override for this project.
  model: "sonnet"               # claude alias (ignored under ollama) | ollama tag
  max_turns: 20
