# TARS Global Configuration
# Sourced by all shell scripts

# Paths
TARS_HOME="${TARS_HOME:-$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)}"
TARS_BIN="${TARS_HOME}/bin"
TARS_LIB="${TARS_HOME}/lib"
TARS_CONFIG="${TARS_HOME}/config"
TARS_STATE="${TARS_HOME}/state"
TARS_LOGS="${TARS_HOME}/logs"
TARS_REPOS="${TARS_HOME}/repos"
TARS_PROMPTS="${TARS_HOME}/prompts"

# Daemon
TARS_PID_FILE="${TARS_STATE}/daemon.pid"
TARS_DISCORD_PID="${TARS_STATE}/discord_bot.pid"
TARS_DASHBOARD_PID="${TARS_STATE}/dashboard.pid"
# Public Flask controller (friend-facing API + dashboard) owns 8420.
# The local FastAPI operator dashboard (lib/dashboard.py) moves to 8421 so both
# can run at once.
TARS_CONTROLLER_PORT="${TARS_CONTROLLER_PORT:-8420}"
TARS_DASHBOARD_PORT="${TARS_DASHBOARD_PORT:-8421}"
export TARS_CONTROLLER_PORT TARS_DASHBOARD_PORT
TARS_POLL_INTERVAL=60           # seconds between task checks
TARS_HEALTH_INTERVAL=300        # seconds between health checks

# Python
TARS_PYTHON="${TARS_PYTHON:-python3}"

# LLM provider — "ollama" runs fully on local models; "claude" uses the CLI.
TARS_LLM_PROVIDER="${TARS_LLM_PROVIDER:-ollama}"
export TARS_LLM_PROVIDER

# Claude CLI (used only when TARS_LLM_PROVIDER=claude)
CLAUDE_CMD="${CLAUDE_CMD:-claude}"
CLAUDE_DEFAULT_MODEL="sonnet"
CLAUDE_MAX_TURNS=20

# Ollama (local models) — used when TARS_LLM_PROVIDER=ollama.
# Verify exact tags with `ollama list` and adjust if they differ.
OLLAMA_HOST="${OLLAMA_HOST:-http://localhost:11434}"
OLLAMA_CODE_MODEL="${OLLAMA_CODE_MODEL:-qwen2.5-coder:32b}"   # bulk coding
OLLAMA_FIX_MODEL="${OLLAMA_FIX_MODEL:-deepseek-r1:70b}"        # fixing
OLLAMA_PLAN_MODEL="${OLLAMA_PLAN_MODEL:-deepseek-r1:70b}"      # planning
OLLAMA_REVIEW_MODEL="${OLLAMA_REVIEW_MODEL:-deepseek-r1:70b}"  # self-review
OLLAMA_CHAT_MODEL="${OLLAMA_CHAT_MODEL:-qwen2.5:7b}"          # chat — small & fast by default
OLLAMA_NUM_CTX="${OLLAMA_NUM_CTX:-16384}"
OLLAMA_TIMEOUT="${OLLAMA_TIMEOUT:-1200}"
# Cap generated tokens so replies stay fast when a long answer isn't needed.
OLLAMA_CHAT_NUM_PREDICT="${OLLAMA_CHAT_NUM_PREDICT:-768}"      # chat replies
OLLAMA_TEXT_NUM_PREDICT="${OLLAMA_TEXT_NUM_PREDICT:-2048}"     # review/plan JSON
# Models that chat with NO system framing (not "coding agents", no TARS identity)
# — open chat, e.g. the uncensored model. Comma-separated tags or base names.
OLLAMA_FREEFORM_MODELS="${OLLAMA_FREEFORM_MODELS:-dolphin-mistral}"
export OLLAMA_HOST OLLAMA_CODE_MODEL OLLAMA_FIX_MODEL OLLAMA_PLAN_MODEL
export OLLAMA_REVIEW_MODEL OLLAMA_CHAT_MODEL OLLAMA_NUM_CTX OLLAMA_TIMEOUT
export OLLAMA_CHAT_NUM_PREDICT OLLAMA_TEXT_NUM_PREDICT OLLAMA_FREEFORM_MODELS

# Git
GH_CMD="${GH_CMD:-gh}"
GIT_CMD="${GIT_CMD:-git}"
export GH_CMD GIT_CMD

# Safety
MAX_TASK_RETRIES=5
MAX_ERROR_RETRIES=3
CIRCUIT_BREAKER_LOCKOUT=3600    # seconds (1 hour)
CIRCUIT_BREAKER_THRESHOLD=3     # consecutive failures before lockout

# Load balancing / resource gate
# Concurrency is 1 by design: the daemon runs tasks synchronously, one at a
# time, guarded by a single-instance flock. Raise real parallelism only by
# adding worker nodes (not yet implemented). The resource gate below prevents
# starting a task when this machine is already saturated.
TARS_MAX_LOADAVG="${TARS_MAX_LOADAVG:-$(nproc 2>/dev/null || echo 4)}"  # 1-min loadavg ceiling
TARS_MIN_FREE_VRAM_MB="${TARS_MIN_FREE_VRAM_MB:-0}"  # 0 = disabled; e.g. 8000 to require 8GB free
export TARS_MAX_LOADAVG TARS_MIN_FREE_VRAM_MB

# Controller API
TARS_API_KEY="${TARS_API_KEY:-431c1b93cd8c7b76b9ffded8ef84080bb589b6af2976db7f98710abe44a36059}"

# Website (tarsai.dev) — used by the worker to call back with live task status.
TARS_WEBSITE_URL="${TARS_WEBSITE_URL:-https://tarsai.dev}"
export TARS_API_KEY TARS_WEBSITE_URL

# Logging
LOG_LEVEL="${LOG_LEVEL:-INFO}"
LOG_DATE_FMT="%Y-%m-%d %H:%M:%S"
